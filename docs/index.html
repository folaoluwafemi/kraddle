<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kraddle — Local-first semantic control system for software." />
    <title>Kraddle — Semantic Control Plane for AI Software</title>

    <!-- Theme Initialization Script (Prevents flash of unstyled theme) -->
    <script>
      (function () {
        const saved = localStorage.getItem('kraddle-theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    
    <!-- Google Fonts: Newsreader (Editorial Serif), Geist (Prose), Geist Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN for layout utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              canvas: 'var(--canvas)',
              'canvas-dark': 'var(--canvas-dark)',
              surface: 'var(--surface)',
              'surface-elevated': 'var(--surface-elevated)',
              'surface-code': 'var(--surface-code)',
              mint: 'var(--mint)',
              'mint-deep': 'var(--mint-deep)',
              'mint-soft': 'var(--mint-soft)',
              ink: 'var(--ink)',
              charcoal: 'var(--charcoal)',
              steel: 'var(--steel)',
              muted: 'var(--muted)',
              hairline: 'var(--hairline)',
              'hairline-strong': 'var(--hairline-strong)',
              'hairline-dark': 'var(--hairline-dark)',
            },
            fontFamily: {
              serif: ['"Arizona Flare"', '"Domaine Display"', 'Newsreader', 'Georgia', 'serif'],
              sans: ['Geist', 'Inter', '-apple-system', 'sans-serif'],
              mono: ['"Geist Mono"', 'SFMono-Regular', 'Consolas', 'monospace'],
            },
          },
        },
      };
    </script>

    <!-- Mintlify & Qel Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-canvas text-charcoal font-sans antialiased selection:bg-mint/25 selection:text-ink">
    <div id="app"></div>

    <!-- Main Multi-File Vue 3 Application -->
    <script type="module" src="app.js"></script>
  </body>
</html>
